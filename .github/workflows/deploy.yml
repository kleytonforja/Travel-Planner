# CI/CD do Travel Planner: qualidade (lint, typecheck, testes, build) e
# publicação no GitHub Pages.
#
# O deploy só ocorre em pushes na branch `master` (ou via execução manual).
# As permissões são mínimas: leitura do conteúdo para o job de qualidade e
# apenas `pages: write` + `id-token: write` para o job de publicação.

name: CI/CD e GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  quality:
    name: Qualidade (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes automatizados
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Empacotar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4
